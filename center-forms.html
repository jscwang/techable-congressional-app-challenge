<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Techable — Center Forms</title><link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="assets/brand.css"><link rel="stylesheet" href="centre-directory.css"><style>.form-field{display:block;margin:16px 0}.form-field textarea,.form-field input:not([type=checkbox]),.form-field select{display:block;width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid var(--border,#ccc);border-radius:10px;margin-top:6px}.form-field textarea{min-height:95px}.form-check{display:block;margin:14px 0;line-height:1.6}.form-status{white-space:pre-wrap}.form-question{white-space:pre-wrap}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media print{header,#tools,.form-actions,button{display:none!important}.workspace{max-width:none}.feature-panel{border:0;box-shadow:none}textarea{border:0!important}body{background:white}}</style></head><body>
